name: tools-list smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 06:00 UTC — catches CDN-detection regressions even when no PRs land.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npx tsc

      - name: tools/list smoke
        run: node scripts/tools-list-smoke.mjs
